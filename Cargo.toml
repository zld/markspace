[package]
name = "postpipe"
version = "0.1.0"
edition = "2021"
description = "Deterministic offline CPU image post-processing pipeline with per-pass metrics, rollback and frame hashing"

[dependencies]
image = "=0.25.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
codegen-units = 1
