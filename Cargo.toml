[package]
name = "edgewatch"
version = "0.1.0"
edition = "2021"
description = "Offline edge-gateway log normalization, session correlation and sliding-window anomaly detection"
license = "MIT"

[lib]
name = "edgewatch"
path = "src/lib.rs"

[[bin]]
name = "edgewatch"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
