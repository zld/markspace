[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopipe"
version = "0.1.0"
description = "Batch polyphase-sinc resampling and BS.1770-4 loudness normalization pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[project.scripts]
audiopipe = "audiopipe.cli:main"

[tool.setuptools]
packages = ["audiopipe"]
