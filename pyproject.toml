[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopipe"
version = "0.1.0"
description = "Offline WAV resampling and loudness normalisation pipeline"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy==1.26.4",
    "soundfile==0.12.1",
]

[project.scripts]
audiopipe = "audiopipe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
