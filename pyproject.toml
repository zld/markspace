[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-composer"
version = "0.1.0"
description = "Offline deterministic timeline compositing with frame summaries and A/V drift checks"
requires-python = ">=3.11"
dependencies = [
    "Pillow==11.2.1",
    "numpy==2.2.6",
]

[project.scripts]
timeline-composer = "timeline_composer.cli:main"

[tool.setuptools]
packages = ["timeline_composer"]
