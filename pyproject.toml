[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotline"
version = "0.1.0"
description = "Offline frame-summarising compositor for verifying animated card timelines"
requires-python = ">=3.11"
dependencies = [
    "Pillow==11.0.0",
    "numpy==2.1.3",
]

[project.scripts]
shotline = "shotline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
