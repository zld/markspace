[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-core"
version = "0.1.0"
description = "Deterministic overlap resolution pipeline for cutscene timelines"
requires-python = ">=3.11"
dependencies = [
    "opentimelineio==0.17.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[project.scripts]
timeline-core = "timeline_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
