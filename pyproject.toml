[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackcheck"
version = "0.1.0"
description = "Local media-container metadata extraction and consistency checker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
