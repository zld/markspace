[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomix"
version = "0.1.0"
description = "Local deterministic multi-track WAV mixing tool with offline and streaming render"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "soundfile>=0.12,<0.14",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
audiomix = "audiomix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
