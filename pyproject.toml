[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvmp4"
version = "0.1.0"
description = "Offline, auditable Matroska to MP4 (ISO BMFF) remuxer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "mkvmp4 authors" }]
dependencies = [
    "numpy>=2.1,<2.2",
]

[project.scripts]
mkvmp4 = "mkvmp4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
