[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline"
version = "0.1.0"
description = "Deterministic editorial timeline model, overlap resolution and offline render sampling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["opentimelineio==0.17.0", "pytest==8.3.5"]

[project.scripts]
cutline = "cutline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
