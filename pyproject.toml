[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-index"
version = "0.1.0"
description = "Self-contained ISO BMFF sidx/stbl parser, timeline rebuilder and validator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3,<8.4"]

[project.scripts]
media-index = "media_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
