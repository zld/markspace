[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline"
version = "0.1.0"
description = "Deterministic timeline assembly, conflict detection, and offline render planning"
requires-python = ">=3.11"
dependencies = [
    "opentimelineio==0.17.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
]

[project.scripts]
cutline = "cutline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
