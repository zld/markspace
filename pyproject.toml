[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslice"
version = "0.1.0"
description = "Local silence detection and segmentation tool for PCM WAV recordings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Audio Tools Team" }]
dependencies = ["numpy==1.26.4"]

[project.scripts]
audioslice = "audioslice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
