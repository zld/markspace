[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosplit"
version = "0.1.0"
description = "Offline PCM WAV segmentation tool with noise-floor adaptive detection"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
audiosplit = "audiosplit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
