[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixforge"
version = "0.1.0"
description = "Deterministic offline/streaming mixdown for game-audio deliverables"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<2.3",
    "soundfile>=0.13,<0.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mixforge = "mixforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
