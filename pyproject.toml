[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixforge"
version = "0.1.0"
description = "Reproducible offline/streaming bus mixer for game audio"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mixforge = "mixforge.cli:main"

[tool.setuptools.packages.find]
include = ["mixforge*"]
