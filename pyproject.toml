[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediacheck"
version = "0.1.0"
description = "Local, dependency-free container metadata probe and build-pipeline verifier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
mediacheck = "mediacheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
