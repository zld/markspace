[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixforge"
version = "0.1.0"
description = "Deterministic local multi-track WAV mixing with gain automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.*",
    "soundfile==0.12.*",
]

[project.optional-dependencies]
test = []

[project.scripts]
mixforge = "mixforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
