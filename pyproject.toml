[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidxcheck"
version = "0.1.0"
description = "Offline ISO BMFF segment index (sidx) and sample table (stbl) verifier"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Media Engineering" }]

[project.scripts]
sidxcheck = "sidxcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
