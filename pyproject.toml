[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediacheck"
version = "0.1.0"
description = "Offline MP4/Matroska metadata probe and track consistency checker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mediacheck = "mediacheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
