[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audiosplit"
version = "0.1.0"
description = "Offline, deterministic WAV event segmentation for game audio pipelines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.optional-dependencies]
test = []

[project.scripts]
audiosplit = "audiosplit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
