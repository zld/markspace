[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mediacheck"
version = "0.1.0"
description = "Local media container metadata extraction and track consistency checks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = []

[project.scripts]
mediacheck = "mediacheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
