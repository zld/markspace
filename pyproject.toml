[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-audit"
version = "0.1.0"
description = "Local off-screen timeline compositing audit tool for season reward cards"
requires-python = ">=3.11"
dependencies = [
    "Pillow==13.0.0",
    "NumPy==2.4.6",
]

[project.scripts]
timeline-audit = "timeline_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
