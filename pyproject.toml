[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslice"
version = "0.1.0"
description = "Local batch tool for detecting speech/sound segments and silence regions in PCM WAV audio."
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
audioslice = "audioslice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
