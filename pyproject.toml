[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixforge"
version = "0.1.0"
description = "Deterministic offline and streaming timeline mixer"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "soundfile==0.12.1",
]

[project.scripts]
mixforge = "mixforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
