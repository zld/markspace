[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomix"
version = "0.1.0"
description = "Local deterministic multi-track mixdown engine with offline and streaming paths"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[project.scripts]
audiomix = "audiomix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
