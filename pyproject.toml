[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderlab"
version = "0.1.0"
description = "Offline encoding-parameter sweep and bitrate-ladder research tool"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[tool.setuptools.packages.find]
where = ["src"]
