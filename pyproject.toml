[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslice"
version = "0.1.0"
description = "Local, reproducible dialogue/sound-event slicer for PCM recordings"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
audioslice = "audioslice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
