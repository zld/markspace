[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-render"
version = "0.1.0"
description = "Deterministic offscreen timeline compositor producing verifiable frame digests"
requires-python = ">=3.11"
dependencies = [
    "Pillow==10.4.0",
    "numpy==2.1.*",
]

[project.optional-dependencies]
test = []

[project.scripts]
timeline-render = "timeline_render.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
