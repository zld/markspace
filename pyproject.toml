[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abr-engine"
version = "0.1.0"
description = "Offline adaptive bitrate decision engine with deterministic network trace simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<2.3"]

[project.scripts]
abr-engine = "abr_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
