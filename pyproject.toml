[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trackaudit"
version = "0.1.0"
description = "Multi-track MP4/ISO BMFF master auditing: box structure validation, track metadata extraction, consistency comparison and packaging."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
