[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslice"
version = "0.1.0"
description = "Silence-aware audio slicing for subtitle alignment and event annotation"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]
