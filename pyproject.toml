[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abrscan"
version = "0.1.0"
description = "Deterministic local ABR ladder scanner using a block-transform codec proxy"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[project.scripts]
abrscan = "abrscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
