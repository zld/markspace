[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvmp4"
version = "0.1.0"
description = "From-scratch local Matroska to MP4 remuxer (no re-encode, no FFmpeg)."
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
mkvmp4 = "mkvmp4.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
