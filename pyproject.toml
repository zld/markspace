[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladderforge"
version = "0.1.0"
description = "Deterministic bitrate-ladder scanner for synthetic game cut-scene footage"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[project.scripts]
ladderforge = "ladderforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
