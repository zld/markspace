[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipweave"
version = "0.1.0"
description = "Deterministic timeline conflict detection, resolution and OTIO export"
requires-python = ">=3.11"
dependencies = [
    "OpenTimelineIO==0.18.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[project.scripts]
clipweave = "clipweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
