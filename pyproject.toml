[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmix"
version = "0.1.0"
description = "Deterministic local multi-rate audio mixing tool with offline and streaming evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[project.scripts]
trackmix = "trackmix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
