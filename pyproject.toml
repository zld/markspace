[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvmp4"
version = "0.1.0"
description = "Local Matroska-to-MP4 remux pipeline with byte-level structural evidence"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools]
packages = ["mkvmp4"]

[tool.setuptools.package-dir]
mkvmp4 = "src/mkvmp4"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
