[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameaudit"
version = "0.1.0"
description = "Local diagnostics for decoded video frame order, frame types and timestamp repair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=12,<13",
    "numpy>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
frameaudit = "frameaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
