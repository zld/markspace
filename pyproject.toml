[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomix"
version = "0.1.0"
description = "Deterministic offline/streaming audio mixing toolkit"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
]

[tool.setuptools]
packages = ["audiomix"]
