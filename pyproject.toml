[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshift"
version = "0.1.0"
description = "Pure-local Matroska to MP4 remuxer with deterministic timestamp rewrite"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
